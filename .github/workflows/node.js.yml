name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for lint tools
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install lint tools
        run: npm ci

      - name: Lint HTML, JavaScript, and CSS
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Check PHP syntax
        run: |
          for file in api/*.php; do
            php -l "$file"
          done